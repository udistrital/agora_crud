services: 
  api:
    build: ./bee_build
    image: ${GESTION_PERSONAS_CRUD_SERVICE_NAME}
    container_name: ${GESTION_PERSONAS_CRUD_SERVICE_NAME}
    volumes:
      - gosrc:/go
      - .:/go/src/${GESTION_PERSONAS_CRUD_API_BASE_DIR}/${GESTION_PERSONAS_CRUD_API_NAME}
    env_file: 
      - .env
    environment:
      GESTION_PERSONAS_CRUD_PGHOST: db
    ports: 
      - "${GESTION_PERSONAS_CRUD_HTTP_PORT}:${GESTION_PERSONAS_CRUD_HTTP_PORT}"
    command: sh -c 'cd ${GESTION_PERSONAS_CRUD_API_BASE_DIR}/${GESTION_PERSONAS_CRUD_API_NAME}; go get -v ./...; bee run -downdoc=true -gendoc=true'
    depends_on: 
      db:
        condition: service_healthy
    networks: 
      - back_end
  db:
    container_name: ${GESTION_PERSONAS_CRUD_PGHOST}
    image: postgres:10
    ports:
      - "${GESTION_PERSONAS_CRUD_PGPORT}:5432"
    volumes: 
      - postgres_data:/var/lib/postgresql/data
      - ./database/agora_proveedores.sql:/docker-entrypoint-initdb.d/agora_proveedores.sql:ro
    environment:
      - POSTGRES_DB=${GESTION_PERSONAS_CRUD_PGDB}
      - POSTGRES_USER=${GESTION_PERSONAS_CRUD_PGUSER}
      - POSTGRES_PASSWORD=${GESTION_PERSONAS_CRUD_PGPASS}
    networks: 
      - back_end
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  gosrc:
  postgres_data:
networks: 
  back_end:
    external: true
